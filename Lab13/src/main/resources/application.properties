spring.application.name=agenda-web

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Monterrey
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=TU_PASSWORD_AQUI

# JPA / Hibernate
# (el dialecto de MySQL se detecta solo; no hace falta declararlo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
