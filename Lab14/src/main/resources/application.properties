spring.application.name=agenda-crud

# ── Por defecto: H2 en archivo (Lab 12). No requiere instalar nada y
#    los datos se conservan en ./data entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/agenda
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
